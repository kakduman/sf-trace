<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%MODEL_NAME% · %MODEL_TAGLINE%</title>
    <meta name="description" content="A travel model of San Francisco transit that runs in the browser: modeled ridership on every route, a check against passenger counts, and scenarios you can build and run." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23132029'/%3E%3Cpath d='M5 16h22' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23132029' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400..800;1,400..600&family=Overpass+Mono:wght@400..600&display=swap" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  </head>
  <body>
    <div id="loading" class="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <svg class="brand-mark lg" viewBox="0 0 40 20" aria-hidden="true"><path d="M2 10h36" /><circle cx="8" cy="10" r="3.2" /><circle cx="20" cy="10" r="5" class="xfer" /><circle cx="32" cy="10" r="3.2" /></svg>
        <h1 title="%MODEL_NAME%: %MODEL_LONG_NAME%">%MODEL_NAME%</h1>
        <p class="loading-long">%MODEL_LONG_NAME%</p>
        <p class="loading-sub">%MODEL_TAGLINE%. Every trip in the city on an average weekday, estimated in your browser from public data.</p>
        <div class="progress" aria-hidden="true"><span id="load-bar"></span></div>
        <p id="load-text" class="loading-text">Downloading the model…</p>
      </div>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <button class="icon-btn sb-toggle" id="sb-toggle" aria-label="Hide side panel" aria-expanded="true" aria-controls="sidebar">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M7 3v12" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
        <div class="brand" title="%MODEL_NAME%: %MODEL_LONG_NAME%. %MODEL_TAGLINE%.">
          <svg class="brand-mark" viewBox="0 0 40 20" aria-hidden="true"><path d="M2 10h36" /><circle cx="8" cy="10" r="3.2" /><circle cx="20" cy="10" r="5" class="xfer" /><circle cx="32" cy="10" r="3.2" /></svg>
          <div class="brand-t">
            <h1><abbr title="%MODEL_LONG_NAME%">%MODEL_NAME%</abbr></h1>
            <span class="brand-sub">Average weekday</span>
          </div>
        </div>
        <div class="seg period" id="period" role="radiogroup" aria-label="Time of day"></div>
        <select id="period-select" class="period-select" aria-label="Time of day"></select>
        <div class="seg day" id="day" role="radiogroup" aria-label="Day of the week"></div>
        <select id="day-select" class="period-select" aria-label="Day of the week"></select>
        <button class="status-pill" id="status" type="button"></button>
        <a class="top-link" href="method/" title="How the model works"><span class="tl-long">Methodology</span><span class="tl-short">Method</span></a>
        <a class="top-link gh-link" href="%MODEL_REPO_URL%" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Source code on GitHub"><svg class="gh-mark" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.37A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg><span class="tl-long">GitHub</span></a>
      </header>
      <div class="body">
        <aside class="sidebar" id="sidebar" aria-label="Panels">
          <button class="sheet-handle" id="sheet-handle" aria-label="Expand panel"><span></span></button>
          <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
          <div class="panels" id="panels"></div>
        </aside>
        <main class="mapwrap" aria-label="Map">
          <div id="map"></div>
        </main>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="./beta3/main.ts"></script>
  </body>
</html>
